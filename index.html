<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>POS System - Login Portal</title>
  <meta name="description"
    content="Secure Point of Sale and Admin Management Portal. Authenticate to access cashier terminal or management dashboard.">

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap"
    rel="stylesheet">

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="css/styles.css?v=3.5">
</head>

<body class="login-page-body">

  <!-- =========================================================
       COOL LAUNDRY OPENING SCREEN (WASHING MACHINE & BUBBLES)
       ========================================================= -->
  <div id="laundry-splash-screen" class="laundry-splash-screen" aria-label="Loading Laundry POS System">
    <div class="splash-bubbles-container" id="splash-bubbles"></div>

    <div class="splash-content-wrapper">
      <!-- Smart Washer Machine Hub -->
      <div class="washer-machine-cabinet">
        <div class="washer-top-bar">
          <div class="washer-power-led"></div>
          <div class="washer-program-display" id="washer-program-display">AUTO CYCLE • 40°C</div>
          <div class="washer-rpm-badge" id="washer-rpm-badge">800 RPM</div>
        </div>

        <div class="washer-door-rim">
          <div class="washer-led-track">
            <div class="washer-led-runner" id="washer-led-runner"></div>
          </div>
          
          <div class="washer-drum-porthole">
            <div class="drum-glass-reflection"></div>

            <div class="drum-interior">
              <div class="water-vortex-layer layer-back"></div>
              <div class="water-vortex-layer layer-front"></div>

              <div class="tumbling-clothes-container" id="splash-tumbling-clothes">
                <div class="tumble-item item-shirt" title="Clean Shirt">
                  <svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor">
                    <path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/>
                  </svg>
                </div>
                <div class="tumble-item item-towel" title="Soft Towel">
                  <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor">
                    <rect x="3" y="5" width="18" height="14" rx="3" />
                  </svg>
                </div>
                <div class="tumble-item item-sock" title="Fabric Sock">
                  <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
                    <path d="M14 2H8a2 2 0 0 0-2 2v9l-2.6 2.6A3 3 0 0 0 2 17.7V19a3 3 0 0 0 3 3h4.3a3 3 0 0 0 2.1-.9L14 18.5V4a2 2 0 0 0 0-2z"/>
                  </svg>
                </div>
              </div>

              <div class="soap-suds-cloud suds-1"></div>
              <div class="soap-suds-cloud suds-2"></div>
              <div class="soap-suds-cloud suds-3"></div>
              <div class="soap-suds-cloud suds-4"></div>
            </div>
          </div>
        </div>

        <div class="washer-door-handle"></div>
      </div>

      <!-- Brand Info & Wash Cycle Progress -->
      <div class="splash-info-box">
        <div class="splash-badge">
          <i data-lucide="droplets"></i>
          <span>PROFESSIONAL LAUNDRY SYSTEM</span>
        </div>
        <h1 class="splash-store-title" id="splash-store-title">POS System</h1>
        <p class="splash-status-sub" id="splash-status-sub">Agitating fresh soapy water & suds...</p>

        <!-- Wash Cycle Stepper -->
        <div class="wash-cycle-stepper">
          <div class="cycle-step step-wash active" id="step-wash">
            <i data-lucide="droplets"></i>
            <span>WASH</span>
          </div>
          <div class="cycle-step-arrow">›</div>
          <div class="cycle-step step-rinse" id="step-rinse">
            <i data-lucide="waves"></i>
            <span>RINSE</span>
          </div>
          <div class="cycle-step-arrow">›</div>
          <div class="cycle-step step-spin" id="step-spin">
            <i data-lucide="rotate-cw"></i>
            <span>SPIN</span>
          </div>
          <div class="cycle-step-arrow">›</div>
          <div class="cycle-step step-clean" id="step-clean">
            <i data-lucide="sparkles"></i>
            <span>READY</span>
          </div>
        </div>

        <!-- Progress Bar -->
        <div class="splash-progress-track">
          <div class="splash-progress-fill" id="splash-progress-fill"></div>
        </div>
        <div class="splash-progress-meta">
          <span id="splash-phase-label">Dispensing gentle detergent...</span>
          <span id="splash-percent-label" class="font-mono">0%</span>
        </div>
      </div>

      <!-- Quick Skip Button -->
      <button type="button" class="splash-skip-btn" id="btn-skip-splash" onclick="LaundrySplash.dismiss()">
        <span>Enter System</span>
        <i data-lucide="arrow-right"></i>
      </button>
    </div>
  </div>

  <!-- Fullscreen Animated Ambient Mesh Background -->
  <div class="login-bg-mesh" aria-hidden="true">
    <div class="mesh-orb orb-1"></div>
    <div class="mesh-orb orb-2"></div>
    <div class="mesh-orb orb-3"></div>
    <div class="mesh-orb orb-4"></div>
    <div class="mesh-grid"></div>
  </div>

  <div class="login-backdrop">
    <div class="login-glass-card">
      <div class="login-header">
        <div class="brand-badge" onclick="playLaundryIntro()" style="cursor: pointer;" title="Click to Replay Opening Screen Animation">
          <i data-lucide="droplets" class="brand-icon"></i>
        </div>
        <h1 class="brand-title" id="login-store-name">POS System</h1>
        <p class="brand-subtitle" id="login-store-tagline">Professional Laundry & POS Management</p>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="login-username"><i data-lucide="user"></i> Username</label>
          <div class="input-with-icon">
            <input type="text" id="login-username" placeholder="Enter your username" autocomplete="username" required autofocus>
          </div>
        </div>

        <div class="form-group">
          <label for="login-password"><i data-lucide="lock"></i> Password</label>
          <div class="input-with-icon">
            <input type="password" id="login-password" placeholder="Enter your password" autocomplete="current-password" required style="padding-right: 2.75rem;">
            <button type="button" id="btn-toggle-password" class="password-toggle-btn" aria-label="Toggle password visibility" tabindex="-1">
              <i data-lucide="eye" id="toggle-password-icon"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="btn-login" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">
          <i data-lucide="log-in"></i> Sign In to POS
        </button>
      </form>

      <div class="login-footer-security" style="margin-top: 1.5rem; text-align: center; font-size: 0.75rem; color: var(--text-muted); display: flex; align-items: center; justify-content: center; gap: 6px;">
        <i data-lucide="shield-check" style="width: 14px; height: 14px; color: var(--success);"></i>
        <span>Database Authenticated & Encrypted Session</span>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/laundry-splash.js"></script>
  <script>
    const AppAuth = {
      _isSubmitting: false,

      async init() {
        LaundrySplash.init({ autoPlay: true, durationMs: 4000 });

        const data = StorageManager.get();
        const storeNameEl = document.getElementById("login-store-name");
        const storeTaglineEl = document.getElementById("login-store-tagline");

        if (storeNameEl && data.settings?.storeName) {
          storeNameEl.textContent = data.settings.storeName;
        }
        if (storeTaglineEl && data.settings?.tagline) {
          storeTaglineEl.textContent = data.settings.tagline;
        }

        // Fetch latest data from database server
        try {
          await StorageManager.fetchFromServer(true);
          const freshData = StorageManager.get();
          if (storeNameEl && freshData.settings?.storeName) {
            storeNameEl.textContent = freshData.settings.storeName;
          }
          if (storeTaglineEl && freshData.settings?.tagline) {
            storeTaglineEl.textContent = freshData.settings.tagline;
          }
        } catch(e) {}

        // Check if redirected due to forced timeout / logout
        const logoutReason = sessionStorage.getItem("LOGOUT_REASON");
        if (logoutReason) {
          sessionStorage.removeItem("LOGOUT_REASON");
          setTimeout(() => {
            if (typeof Sound !== "undefined" && Sound.playError) Sound.playError();
            this.showToast(logoutReason, "danger");
          }, 300);
        }

        const form = document.getElementById("login-form");
        if (form) {
          form.addEventListener("submit", (e) => {
            e.preventDefault();
            e.stopPropagation();
            this.handleLogin(e);
          });
        }

        const toggleBtn = document.getElementById("btn-toggle-password");
        const passInput = document.getElementById("login-password");
        if (toggleBtn && passInput) {
          toggleBtn.addEventListener("click", () => {
            const isPass = passInput.type === "password";
            passInput.type = isPass ? "text" : "password";
            const icon = document.getElementById("toggle-password-icon");
            if (icon) {
              icon.setAttribute("data-lucide", isPass ? "eye-off" : "eye");
              if (window.lucide) lucide.createIcons();
            }
          });
        }

        if (window.lucide) lucide.createIcons();
      },

      async handleLogin(e) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }

        if (this._isSubmitting) return;

        const user = document.getElementById("login-username").value.trim();
        const pass = document.getElementById("login-password").value;
        const btn = document.getElementById("btn-login");

        if (!user || !pass) return;

        this._isSubmitting = true;

        if (btn) {
          btn.disabled = true;
          btn.innerHTML = `<i data-lucide="loader-2" class="spin"></i> Verifying...`;
          if (window.lucide) lucide.createIcons();
        }

        try {
          // Authenticate strictly against Railway Server Database API
          const apiUrl = (typeof getApiUrl === "function") ? getApiUrl("/api/auth/login") : (window.getApiUrl ? window.getApiUrl("/api/auth/login") : "https://web-production-93c73.up.railway.app/api/auth/login");
          const res = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: user, password: pass })
          });

          if (res.ok) {
            const result = await res.json();
            if (result.success && result.user) {
              this.onLoginSuccess(result.user, result.sessionId);
              return;
            }
          }
          
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || "Invalid username or password.");
        } catch (err) {
          Sound.playError();
          this.showToast(err.message || "Authentication failed. Could not connect to database.", "danger");
        } finally {
          this._isSubmitting = false;
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = `<i data-lucide="log-in"></i> Sign In to POS`;
            if (window.lucide) lucide.createIcons();
          }
        }
      },

      onLoginSuccess(user, sessionId) {
        sessionStorage.setItem("POS_ACTIVE_USER", JSON.stringify(user));
        localStorage.setItem("POS_ACTIVE_USER", JSON.stringify(user));
        if (sessionId) {
          sessionStorage.setItem("POS_ACTIVE_SESSION_ID", sessionId);
          localStorage.setItem("POS_ACTIVE_SESSION_ID", sessionId);
        }

        if (typeof AttendanceManager !== "undefined") {
          AttendanceManager.recordTimeIn(user);
        }

        Sound.playSuccess();
        this.showToast(`Welcome back, ${user.fullName}! Redirecting...`, "success");

        const targetUrl = user.role === "ADMIN" ? "admin.html" : "pos.html";
        setTimeout(() => {
          window.location.replace(targetUrl);
        }, 300);
      },

      showToast(message, type = "info") {
        const container = document.getElementById("toast-container");
        if (!container || !message) return;

        // Prevent duplicate toasts
        const existing = container.querySelectorAll(".toast span");
        for (const el of existing) {
          if (el.textContent.trim() === message.trim()) {
            return;
          }
        }

        const toast = document.createElement("div");
        toast.className = `toast toast-${type}`;
        const icons = { success: "check-circle", danger: "alert-circle", info: "info" };
        toast.innerHTML = `<i data-lucide="${icons[type] || 'info'}"></i><span>${message}</span>`;
        container.appendChild(toast);
        if (window.lucide) lucide.createIcons();
        setTimeout(() => {
          toast.style.opacity = "0";
          setTimeout(() => toast.remove(), 250);
        }, 2500);
      }
    };

    document.addEventListener("DOMContentLoaded", () => AppAuth.init());
  </script>
</body>

</html>
