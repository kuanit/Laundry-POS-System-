<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>POS System - Login Portal</title>
  <meta name="description"
    content="Secure Point of Sale and Admin Management Portal. Authenticate to access cashier terminal or management dashboard.">

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap"
    rel="stylesheet">

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Login Portal strictly remains in Dark Mode -->
  <script>
    document.documentElement.setAttribute("data-theme", "dark");
  </script>

  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0284c7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Laundry POS">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="css/styles.css?v=4.0">
</head>

<body class="login-page-body">

  <!-- =========================================================
       COOL LAUNDRY OPENING SCREEN (ULTRA-MODERN APPLIANCE POD)
       ========================================================= -->
  <div id="laundry-splash-screen" class="laundry-splash-screen" aria-label="Loading Laundry POS System">
    <!-- Ambient Glowing Aurora Mesh -->
    <div class="splash-ambient-glow glow-1"></div>
    <div class="splash-ambient-glow glow-2"></div>
    <div class="splash-bubbles-container" id="splash-bubbles"></div>

    <!-- Modern Glassmorphism Appliance Pod -->
    <div class="splash-modern-pod">

      <!-- Console Top Telemetry Bar -->
      <div class="pod-header">
        <div class="pod-header-left">
          <span class="pod-live-indicator">
            <span class="live-dot"></span>
            <span class="live-text">AI DIRECT DRIVE 6.0</span>
          </span>
        </div>
        <div class="pod-header-right">
          <span class="pod-eco-badge">
            <i data-lucide="zap"></i> ECO INVERTER
          </span>
        </div>
      </div>

      <!-- Washing Machine Drum Assembly -->
      <div class="washer-drum-section">

        <!-- Left Telemetry Pill -->
        <div class="washer-telemetry-chip chip-left">
          <div class="chip-icon"><i data-lucide="gauge"></i></div>
          <div class="chip-data">
            <span class="chip-val" id="washer-rpm-value">800</span>
            <span class="chip-lbl">RPM</span>
          </div>
        </div>

        <!-- Futuristic Outer Bezel & Drum -->
        <div class="washer-modern-door">
          <!-- Hex Accent Bolts -->
          <span class="bezel-bolt bolt-top"></span>
          <span class="bezel-bolt bolt-right"></span>
          <span class="bezel-bolt bolt-bottom"></span>
          <span class="bezel-bolt bolt-left"></span>

          <!-- Tachometer LED Glow Ring -->
          <div class="door-neon-ring">
            <div class="door-neon-runner"></div>
          </div>

          <!-- Convex Crystal Glass Porthole -->
          <div class="door-glass-window">
            <div class="glass-specular-glare"></div>
            <div class="glass-lens-glint"></div>

            <!-- Drum Interior (Perforations & Wash Chamber) -->
            <div class="drum-chamber">
              <div class="drum-stainless-bg"></div>

              <!-- Swirling Water Layers -->
              <div class="water-vortex-layer back-vortex"></div>
              <div class="water-vortex-layer front-vortex"></div>

              <!-- Tumbling Clothes in Wash -->
              <div class="tumbling-clothes-container" id="splash-tumbling-clothes">
                <div class="tumble-item item-shirt" title="Cotton Tee">
                  <svg viewBox="0 0 24 24" width="40" height="40" fill="currentColor">
                    <path
                      d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z" />
                  </svg>
                </div>
                <div class="tumble-item item-towel" title="Plush Towel">
                  <svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor">
                    <rect x="3" y="5" width="18" height="14" rx="3" />
                  </svg>
                </div>
                <div class="tumble-item item-sock" title="Sport Sock">
                  <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor">
                    <path
                      d="M14 2H8a2 2 0 0 0-2 2v9l-2.6 2.6A3 3 0 0 0 2 17.7V19a3 3 0 0 0 3 3h4.3a3 3 0 0 0 2.1-.9L14 18.5V4a2 2 0 0 0 0-2z" />
                  </svg>
                </div>
                <div class="tumble-item item-linen" title="Fresh Fabric">
                  <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                  </svg>
                </div>
              </div>

              <!-- Foamy Soap Suds Clouds -->
              <div class="soap-suds-cloud suds-1"></div>
              <div class="soap-suds-cloud suds-2"></div>
              <div class="soap-suds-cloud suds-3"></div>
              <div class="soap-suds-cloud suds-4"></div>
            </div>
          </div>
        </div>

        <!-- Right Telemetry Pill -->
        <div class="washer-telemetry-chip chip-right">
          <div class="chip-icon"><i data-lucide="thermometer"></i></div>
          <div class="chip-data">
            <span class="chip-val" id="washer-temp-value">40°C</span>
            <span class="chip-lbl">STEAM</span>
          </div>
        </div>
      </div>

      <!-- Brand Title & Program Status -->
      <div class="pod-info-center">
        <div class="splash-badge">
        </div>
        <h1 class="splash-store-title" id="splash-store-title">POS System</h1>
        <p class="splash-status-sub" id="splash-status-sub">Agitating fresh soapy water & oxygen suds...</p>

        <!-- High-Tech Wash Cycle Segmented Stepper -->
        <div class="modern-cycle-stepper">
          <div class="modern-step step-wash active" id="step-wash">
            <div class="step-num">01</div>
            <div class="step-label">WASH</div>
          </div>
          <div class="step-divider"></div>
          <div class="modern-step step-rinse" id="step-rinse">
            <div class="step-num">02</div>
            <div class="step-label">RINSE</div>
          </div>
          <div class="step-divider"></div>
          <div class="modern-step step-spin" id="step-spin">
            <div class="step-num">03</div>
            <div class="step-label">SPIN</div>
          </div>
          <div class="step-divider"></div>
          <div class="modern-step step-clean" id="step-clean">
            <div class="step-num">04</div>
            <div class="step-label">READY</div>
          </div>
        </div>

        <!-- Shimmer Fluid Progress Bar -->
        <div class="modern-progress-box">
          <div class="modern-progress-track">
            <div class="modern-progress-fill" id="splash-progress-fill"></div>
            <div class="modern-progress-shimmer"></div>
          </div>
          <div class="modern-progress-meta">
            <span id="splash-phase-label">Dispensing gentle detergent & bubbles...</span>
            <span id="splash-percent-label" class="modern-percent-num font-mono">0%</span>
          </div>
        </div>

        <!-- Skip / Launch Button -->
        <button type="button" class="modern-skip-btn" id="btn-skip-splash" onclick="LaundrySplash.dismiss()">
          <span>Skip to Terminal</span>
          <i data-lucide="arrow-right"></i>
        </button>
      </div>

    </div>
  </div>

  <!-- Fullscreen Animated Ambient Mesh Background -->
  <div class="login-bg-mesh" aria-hidden="true">
    <div class="mesh-orb orb-1"></div>
    <div class="mesh-orb orb-2"></div>
    <div class="mesh-orb orb-3"></div>
    <div class="mesh-orb orb-4"></div>
    <div class="mesh-grid"></div>
  </div>

  <div class="login-backdrop">
    <div class="login-glass-card">
      <div class="login-header">
        <div class="brand-badge" onclick="playLaundryIntro()" style="cursor: pointer;"
          title="Click to Replay Opening Screen Animation">
          <i data-lucide="droplets" class="brand-icon"></i>
        </div>
        <h1 class="brand-title" id="login-store-name">POS System</h1>
        <p class="brand-subtitle" id="login-store-tagline">Professional Laundry & POS Management</p>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="login-username"><i data-lucide="user"></i> Username</label>
          <div class="input-with-icon">
            <input type="text" id="login-username" placeholder="Enter your username" autocomplete="username" required
              autofocus>
          </div>
        </div>

        <div class="form-group">
          <label for="login-password"><i data-lucide="lock"></i> Password</label>
          <div class="input-with-icon">
            <input type="password" id="login-password" placeholder="Enter your password" autocomplete="current-password"
              required style="padding-right: 2.75rem;">
            <button type="button" id="btn-toggle-password" class="password-toggle-btn"
              aria-label="Toggle password visibility" tabindex="-1">
              <i data-lucide="eye" id="toggle-password-icon"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="btn-login" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">
          <i data-lucide="log-in"></i> Sign In to POS
        </button>
      </form>

      <div class="login-footer-security"
        style="margin-top: 1.5rem; text-align: center; font-size: 0.75rem; color: var(--text-muted); display: flex; align-items: center; justify-content: center; gap: 6px;">
        <i data-lucide="shield-check" style="width: 14px; height: 14px; color: var(--success);"></i>
        <span>Database Authenticated & Encrypted Session</span>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/laundry-splash.js"></script>
  <script>
    const AppAuth = {
      _isSubmitting: false,

      async init() {
        const storeNameEl = document.getElementById("login-store-name");
        const storeTaglineEl = document.getElementById("login-store-tagline");

        // Immediately apply cached store branding
        const cachedData = StorageManager.get();
        if (storeNameEl && cachedData.settings?.storeName) {
          storeNameEl.textContent = cachedData.settings.storeName;
        }
        if (storeTaglineEl && cachedData.settings?.tagline) {
          storeTaglineEl.textContent = cachedData.settings.tagline;
        }

        // Real asynchronous data synchronization promise from database server
        const syncPromise = (async () => {
          try {
            await StorageManager.fetchFromServer(true);
            const freshData = StorageManager.get();
            if (storeNameEl && freshData.settings?.storeName) {
              storeNameEl.textContent = freshData.settings.storeName;
            }
            if (storeTaglineEl && freshData.settings?.tagline) {
              storeTaglineEl.textContent = freshData.settings.tagline;
            }
          } catch (e) {
            console.warn("Server sync notice:", e);
          }
        })();

        // Start splash screen dynamically bound to actual site & database loading
        LaundrySplash.init({
          trackActualLoad: true,
          syncPromise: syncPromise,
          minDurationMs: 750,
          maxDurationMs: 4500
        });

        // Check if redirected due to forced timeout / logout
        const logoutReason = sessionStorage.getItem("LOGOUT_REASON");
        if (logoutReason) {
          sessionStorage.removeItem("LOGOUT_REASON");
          setTimeout(() => {
            if (typeof Sound !== "undefined" && Sound.playError) Sound.playError();
            this.showToast(logoutReason, "danger");
          }, 300);
        }

        const form = document.getElementById("login-form");
        if (form) {
          form.addEventListener("submit", (e) => {
            e.preventDefault();
            e.stopPropagation();
            this.handleLogin(e);
          });
        }

        const toggleBtn = document.getElementById("btn-toggle-password");
        const passInput = document.getElementById("login-password");
        if (toggleBtn && passInput) {
          toggleBtn.addEventListener("click", () => {
            const isPass = passInput.type === "password";
            passInput.type = isPass ? "text" : "password";
            const icon = document.getElementById("toggle-password-icon");
            if (icon) {
              icon.setAttribute("data-lucide", isPass ? "eye-off" : "eye");
              if (window.lucide) lucide.createIcons();
            }
          });
        }

        if (window.lucide) lucide.createIcons();
      },

      async handleLogin(e) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }

        if (this._isSubmitting) return;

        const user = document.getElementById("login-username").value.trim();
        const pass = document.getElementById("login-password").value;
        const btn = document.getElementById("btn-login");

        if (!user || !pass) return;

        this._isSubmitting = true;

        if (btn) {
          btn.disabled = true;
          btn.innerHTML = `<i data-lucide="loader-2" class="spin"></i> Verifying...`;
          if (window.lucide) lucide.createIcons();
        }

        try {
          // Authenticate strictly against Railway Server Database API
          const apiUrl = (typeof getApiUrl === "function") ? getApiUrl("/api/auth/login") : (window.getApiUrl ? window.getApiUrl("/api/auth/login") : "https://web-production-93c73.up.railway.app/api/auth/login");
          const res = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: user, password: pass })
          });

          if (res.ok) {
            const result = await res.json();
            if (result.success && result.user) {
              this.onLoginSuccess(result.user, result.sessionId);
              return;
            }
          }

          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || "Invalid username or password.");
        } catch (err) {
          Sound.playError();
          this.showToast(err.message || "Authentication failed. Could not connect to database.", "danger");
        } finally {
          this._isSubmitting = false;
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = `<i data-lucide="log-in"></i> Sign In to POS`;
            if (window.lucide) lucide.createIcons();
          }
        }
      },

      onLoginSuccess(user, sessionId) {
        // Save user account's theme for the POS / Admin portals
        const accountTheme = user.theme || "dark";
        localStorage.setItem("POS_THEME", accountTheme);
        // Login screen and any popups strictly remain in Dark Mode
        document.documentElement.setAttribute("data-theme", "dark");

        sessionStorage.setItem("POS_ACTIVE_USER", JSON.stringify(user));
        localStorage.setItem("POS_ACTIVE_USER", JSON.stringify(user));
        if (sessionId) {
          sessionStorage.setItem("POS_ACTIVE_SESSION_ID", sessionId);
          localStorage.setItem("POS_ACTIVE_SESSION_ID", sessionId);
        }

        if (typeof AttendanceManager !== "undefined") {
          AttendanceManager.recordTimeIn(user);
        }

        Sound.playSuccess();
        this.showToast(`Welcome back, ${user.fullName}! Redirecting...`, "success");

        const targetUrl = user.role === "ADMIN" ? "admin.html" : "pos.html";
        setTimeout(() => {
          window.location.replace(targetUrl);
        }, 300);
      },

      showToast(message, type = "info") {
        const container = document.getElementById("toast-container");
        if (!container || !message) return;

        // Prevent duplicate toasts
        const existing = container.querySelectorAll(".toast span");
        for (const el of existing) {
          if (el.textContent.trim() === message.trim()) {
            return;
          }
        }

        const toast = document.createElement("div");
        toast.className = `toast toast-${type}`;
        const icons = { success: "check-circle", danger: "alert-circle", info: "info" };
        toast.innerHTML = `<i data-lucide="${icons[type] || 'info'}"></i><span>${message}</span>`;
        container.appendChild(toast);
        if (window.lucide) lucide.createIcons();
        setTimeout(() => {
          toast.style.opacity = "0";
          setTimeout(() => toast.remove(), 250);
        }, 2500);
      }
    };

    document.addEventListener("DOMContentLoaded", () => AppAuth.init());

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(() => {});
      });
    }
  </script>
</body>

</html>
