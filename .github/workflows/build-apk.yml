name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Laundry POS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradlew
        run: |
          cd android
          gradle wrapper
          chmod +x gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Prepare APK File
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/KusokusoLaundryPOS.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KusokusoLaundryPOS-APK
          path: output/KusokusoLaundryPOS.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-apk
          name: "Laundry POS Android APK v1.0.0"
          body: |
            ### 📱 Kusokuso Laundry POS Android APK

            Download `KusokusoLaundryPOS.apk` below and install it directly onto your Android tablet.

            **Features in this APK:**
            - Fullscreen dedicated cashier POS interface (no Chrome URL bar or tabs)
            - Direct USB Vozy G80 ESC/POS thermal printing
            - Live camera barcode scanning
            - Screen stays on while working (no sleep timeout)
          files: output/KusokusoLaundryPOS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
